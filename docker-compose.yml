services:
  bindy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY}
    container_name: bindy-app
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - server/.env
    volumes:
      - ./server/data:/app/server/data
      - ./server/.env:/app/server/.env:ro
